<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PS4 Retro-Futuristic Vault</title>
  <!-- Tailwind CSS para diseño rápido y responsivo -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            orbitron: ['Orbitron', 'sans-serif'],
            mono: ['Share Tech Mono', 'monospace'],
          },
          colors: {
            cyberpunk: '#05050a',
            neonCyan: '#00f0ff',
            neonPink: '#ff007f',
            neonYellow: '#f3e600',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #05050a;
      color: #e2e8f0;
      font-family: 'Share Tech Mono', monospace;
    }
    /* Efecto de líneas CRT de pantallas retro */
    .crt::after {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      z-index: 99999;
      background-size: 100% 3px, 3px 100%;
      pointer-events: none;
    }
    .neon-border {
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
      transition: all 0.3s ease-in-out;
    }
    .neon-border:hover {
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.6);
      border-color: #ff007f;
    }

    /* Animación del carrusel infinito */
    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .carousel-track {
      display: flex;
      width: max-content;
      animation: marquee 35s linear infinite;
    }

    .carousel-container:hover .carousel-track {
      animation-play-state: paused;
    }

    /* Deshabilitar scroll horizontal general */
    .carousel-viewport {
      overflow: hidden;
      width: 100%;
      position: relative;
    }
  </style>
</head>
<body class="crt min-h-screen flex flex-col justify-between p-6">

  <!-- Header -->
  <header class="max-w-7xl mx-auto w-8/12 text-center my-8">
    <h1 class="font-orbitron text-4xl md:text-6xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-neonCyan via-neonYellow to-neonPink drop-shadow-[0_5px_15px_rgba(0,240,255,0.4)]">
      PS4_VAULT // 04
    </h1>
    <p class="text-neonCyan/70 mt-2 text-sm md:text-base tracking-widest uppercase">
      [ Sistema de Archivo Conceptual & Portadas ]
    </p>

    <!-- Barra de Búsqueda Interactiva -->
    <div class="mt-6 flex justify-center">
      <input type="text" id="searchInput" placeholder="FILTRAR PROTOCOLO (EJ: God of War, Spider-Man)..." 
        class="w-full max-w-md bg-black/60 border border-neonCyan/40 text-neonCyan placeholder-neonCyan/30 px-4 py-3 rounded-none focus:outline-none focus:border-neonPink transition font-mono text-sm tracking-widest shadow-inner">
    </div>
  </header>

  <!-- Carrusel Infinito de Juegos -->
  <main class="w-full flex-grow flex items-center overflow-hidden my-auto py-8">
    <div class="carousel-viewport carousel-container">
      <div id="carouselTrack" class="carousel-track gap-6">
        <!-- Los juegos se inyectarán dinámicamente aquí mediante JavaScript -->
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center mt-12 text-xs text-neonCyan/40 font-mono tracking-widest">
    <p>SECURE_GRID_PROTOCOL // READY STATE</p>
  </footer>

  <!-- Script de Automatización y Carrusel -->
  <script>
    const gamesData = [
      {
        title: "Marvel's Spider-Man",
        platform: "PS4",
        coverUrl: "https://media.gamestop.com/i/gamestop/10131620/Marvels-Spider-Man",
        storeUrl: "https://store.playstation.com/es-mx/product/UP9000-CUSA02299_00-MARVELSSMGOTY000"
      },
      {
        title: "God of War",
        platform: "PS4",
        coverUrl: "https://fixit.com.bd/wp-content/uploads/2023/09/cover-11-1.webp",
        storeUrl: "https://store.playstation.com/en-us/product/UP9000-CUSA07408_00-00000000GODOFWAR"
      },
      {
        title: "The Last of Us Remastered",
        platform: "PS4",
        coverUrl: "https://i.ebayimg.com/images/g/R7oAAeSwVotof-QM/s-l500.jpg",
        storeUrl: "https://store.playstation.com/es-co/product/UP9000-CUSA00552_00-THELASTOFUS00000"
      },
      {
        title: "The Last of Us Part II",
        platform: "PS4",
        coverUrl: "https://media.gamestop.com/i/gamestop/11097389/The-Last-of-Us-Part-II---PlayStation-4?fmt=auto&h=768&w=768",
        storeUrl: "https://store.playstation.com/es-mx/product/UP9000-CUSA07820_00-THELASTOFUSPART2"
      },
      {
        title: "The King of Fighters XIV",
        platform: "PS4",
        coverUrl: "https://media.gamestop.com/i/gamestop/10130375/The-King-of-Fighters-XIV?fmt=auto&h=768&w=768",
        storeUrl: "https://store.playstation.com/"
      },
      {
        title: "Days Gone",
        platform: "PS4",
        coverUrl: "https://promart.vteximg.com.br/arquivos/ids/6844200-1000-1000/image-2644f932143c404791bdf74c35f8cfe5.jpg?v=638145061946970000",
        storeUrl: "https://store.playstation.com/en-us/product/UP9000-CUSA08966_00-DAYSGONECOMPLETE"
      },
      {
        title: "Journey",
        platform: "PS4",
        coverUrl: "https://cdn-uploads.gameblog.fr/images/jeux/17661/Journey_PS4_Jaquette_001.jpg",
        storeUrl: "https://store.playstation.com/"
      },
      {
        title: "Toki",
        platform: "PS4",
        coverUrl: "https://c1-ebgames.eb-cdn.com.au/merchandising/images/packshots/4ace622ca3a54d67a7dcfb77243c541b_Original.jpg",
        storeUrl: "https://store.playstation.com/es-mx/product/UP1475-CUSA15144_00-TOKI0000000000US"
      },
      {
        title: "Persona 5",
        platform: "PS4",
        coverUrl: "https://media.gamestop.com/i/gamestop/10146553/Persona-5---PlayStation-4?fmt=auto&h=768&w=768",
        storeUrl: "https://store.playstation.com/"
      },
      {
        title: "Horizon Zero Dawn",
        platform: "PS4",
        coverUrl: "https://media.falabella.com/falabellaCO/123238870_01/w%3D1500%2Ch%3D1500%2Cfit%3Dcover",
        storeUrl: "https://store.playstation.com/es-mx/product/UP9000-CUSA10237_00-HRZCE00000000000"
      },
      {
        title: "Shadow of the Colossus",
        platform: "PS4",
        coverUrl: "https://media.gamestop.com/i/gamestop/10149676/Shadow-of-the-Colossus---PlayStation-4?fmt=auto&h=768&w=768",
        storeUrl: "https://store.playstation.com/"
      },
      {
        title: "The Last Guardian",
        platform: "PS4",
        coverUrl: "https://media.gamestop.com/i/gamestop/10131459/The-Last-Guardian?fmt=auto&h=768&w=768",
        storeUrl: "https://store.playstation.com/"
      },
      {
        title: "Uncharted: Nathan Drake Collection",
        platform: "PS4",
        coverUrl: "https://vistapointe.net/images/uncharted-the-nathan-drake-collection-wallpaper-10.jpg",
        storeUrl: "https://store.playstation.com/"
      },
      {
        title: "Uncharted 4: A Thief's End",
        platform: "PS4",
        coverUrl: "https://i5.walmartimages.com/asr/8c237119-800b-4f9f-9f2b-63beaf2105c7_1.beaddafb0fc32766074059459cf02fc0.jpeg",
        storeUrl: "https://store.playstation.com/en-us/product/UP9000-CUSA00341_00-UNCHARTED0000000"
      }
    ];

    const carouselTrack = document.getElementById('carouselTrack');
    const searchInput = document.getElementById('searchInput');

    function createCardHTML(game) {
      return `
        <div class="group relative bg-black border border-neonCyan/30 neon-border overflow-hidden flex flex-col justify-between w-[220px] sm:w-[260px] flex-shrink-0">
          <a href="${game.storeUrl}" target="_blank" rel="noopener noreferrer" class="block relative aspect-[3/4] overflow-hidden bg-zinc-900">
            <img src="${game.coverUrl}" alt="${game.title}" loading="lazy" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110 group-hover:opacity-90">
            <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent opacity-80"></div>
            <span class="absolute top-2 right-2 bg-black/80 border border-neonCyan text-neonCyan text-[10px] px-2 py-0.5 tracking-wider font-orbitron">
              ${game.platform}
            </span>
          </a>
          <div class="p-3 border-t border-neonCyan/20 bg-black/90">
            <h3 class="font-orbitron text-xs font-semibold text-neonCyan tracking-wide truncate group-hover:text-neonPink transition-colors">
              ${game.title}
            </h3>
          </div>
        </div>
      `;
    }

    function renderCarousel(filterText = '') {
      carouselTrack.innerHTML = '';
      
      const filtered = gamesData.filter(game => 
        game.title.toLowerCase().includes(filterText.toLowerCase())
      );

      if(filtered.length === 0) {
        carouselTrack.innerHTML = `<div class="text-neonPink tracking-widest py-10 w-screen text-center">[ NO SE ENCONTRARON COINCIDENCIAS ]</div>`;
        return;
      }

      // Duplicamos el set de datos filtrados para lograr el efecto de bucle infinito continuo
      let htmlContent = '';
      const itemsToRender = [...filtered, ...filtered]; // Duplicado exacto para la transición sin saltos
      
      itemsToRender.forEach(game => {
        htmlContent += createCardHTML(game);
      });

      carouselTrack.innerHTML = htmlContent;
    }

    // Inicializar carrusel
    renderCarousel();

    // Evento de búsqueda dinámica
    searchInput.addEventListener('input', (e) => {
      renderCarousel(e.target.value);
    });
  </script>
</body>
</html>
